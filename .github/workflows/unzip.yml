name: Unzip upload
on:
  push:
    paths:
      - '.github/workflows/unzip.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and commit files
        run: |
          unzip -o dapur-kilat.zip
          rm dapur-kilat.zip
          if [ ! -f main.ts ]; then
            for d in */; do
              if [ -f "$d/main.ts" ]; then cp -a "$d/." .; rm -rf "$d"; break; fi
            done
          fi
          ls -la
          rm -rf .github
          git config user.name "Elyonel28"
          git config user.email "Elyonel28@users.noreply.github.com"
          git add -A
          git commit -m "Upload game files from dapur-kilat.zip" || echo "nothing to commit"
          git push
